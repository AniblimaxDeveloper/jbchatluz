name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - run: flutter create . --platforms=android --org com.jbchatluz --project-name jbchatluz

      # PERBAIKAN TOTAL: Paksa AndroidX dan minSdk 23 langsung ke build.gradle
      - name: Fix AndroidX and minSdk
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 23/' android/app/build.gradle

      # Setup Firebase
      - name: Setup Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - run: flutter pub get

      # Generate Icon Logo Baru
      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jbchatluz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
