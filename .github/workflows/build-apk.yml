name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - run: flutter create . --platforms=android --org com.jbchatluz --project-name jbchatluz

      # PERBAIKAN TOTAL: Hancurkan error minSdk 21
      - name: Fix AndroidX and minSdk
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Ganti variabel flutter.minSdkVersion (yang bernilai 21) menjadi angka 23 murni
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts
          fi
          
          # Paksa di file Manifest jika masih ngotot 21
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/minSdkVersion="21"/minSdkVersion="23"/g' android/app/src/main/AndroidManifest.xml
          fi

      # Setup Firebase
      - name: Setup Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - run: flutter pub get

      # Generate Icon Logo Baru
      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jbchatluz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
