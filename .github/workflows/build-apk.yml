name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - run: flutter create . --platforms=android --org com.jbchatluz --project-name jbchatluz

      - name: Fix Gradle, Memory, and Add Firebase Plugin
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          
          # Fix minSdk
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
            # Tambahkan plugin google-services di bagian paling bawah file
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts
            echo 'id("com.google.gms.google-services")' >> android/app/build.gradle.kts
          fi

      - name: Setup Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jbchatluz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
