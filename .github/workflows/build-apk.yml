name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - run: flutter create . --platforms=android --org com.jbchatluz --project-name jbchatluz

      - name: Fix Android Config & Inject Firebase Plugin
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle
          fi

      - name: Setup Google Services (Python Decoder)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import base64, os
          # Ambil dari environment
          b64_str = os.environ.get('GOOGLE_SERVICES_B64', '')
          # Hapus semua spasi dan enter
          b64_str = ''.join(b64_str.split())
          # Tambahkan padding otomatis jika kurang
          b64_str += '=' * (-len(b64_str) % 4)
          # Decode dan tulis ke file
          with open('android/app/google-services.json', 'wb') as f:
              f.write(base64.b64decode(b64_str))
          "
          python3 -m json.tool android/app/google-services.json > /dev/null || (echo "ERROR: Secret tidak valid!" && exit 1)

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jbchatluz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
